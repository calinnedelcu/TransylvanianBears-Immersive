  <body>
    <div id="root"></div>
    <script>
      (function restoreSpaRoute() {
        var key = 'transylvanian-bears-spa-route';
        var redirect = window.sessionStorage.getItem(key);
        if (!redirect) return;

        window.sessionStorage.removeItem(key);
        try {
          var target = new URL(redirect);
          if (target.origin === window.location.origin) {
            window.history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        } catch (_) {
          // Keep the root URL when the stored redirect is malformed.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
