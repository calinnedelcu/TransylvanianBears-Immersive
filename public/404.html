<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Pagina nu există — Transylvanian Bears</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #140b0d;
        color: #f5eedf;
        font-family: 'Arial Narrow', Impact, system-ui, sans-serif;
      }
      main { width: min(720px, 100%); }
      .code { margin: 0; color: #ffc531; font-family: Impact, 'Arial Narrow', sans-serif; font-size: clamp(7rem, 30vw, 15rem); line-height: .85; }
      .kicker { margin: 28px 0 0; color: #ffc531; font: 600 .75rem/1.4 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font: 900 clamp(2rem, 8vw, 3.6rem)/1 Impact, 'Arial Narrow', sans-serif; text-transform: uppercase; }
      p { margin: 0; max-width: 46ch; font: 400 1.1rem/1.5 system-ui, sans-serif; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        margin-top: 28px;
        padding: 0 28px;
        border: 2.5px solid #140b0d;
        border-radius: 999px;
        background: #ffc531;
        box-shadow: 4px 4px 0 #f5eedf;
        color: #140b0d;
        font: 700 1rem system-ui, sans-serif;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #ffc531; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <p class="kicker">Eroare 404</p>
      <h1>Drumul acesta nu face parte din sistem.</h1>
      <p>Ruta cerută nu există. Revino pe pagina principală sau deschide direct proiectele.</p>
      <a href="/">Înapoi acasă</a>
    </main>
  </body>
</html>
