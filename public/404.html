<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function redirectKnownSpaRoute() {
        var routes = ['/work', '/team', '/archive', '/next', '/echipa', '/proiecte', '/premii', '/despre', '/aplica'];
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var isKnownRoute = routes.some(function (route) {
          return path === route || path.indexOf(route + '/') === 0;
        });
        if (!isKnownRoute) return;
        window.sessionStorage.setItem('transylvanian-bears-spa-route', window.location.href);
        window.location.replace('/');
      })();
    </script>
    <meta name="theme-color" content="#070A0B" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Pagina nu există | Transylvanian Bears</title>
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <style>
      * { box-sizing: border-box; letter-spacing: 0; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: #070a0b;
        color: #e4e1d9;
        font-family: Arial, sans-serif;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        opacity: .32;
        background-image:
          linear-gradient(rgb(228 225 217 / .07) 1px, transparent 1px),
          linear-gradient(90deg, rgb(228 225 217 / .07) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(90deg, transparent, #000 35% 65%, transparent);
      }
      main {
        position: relative;
        display: grid;
        width: min(1060px, calc(100% - 40px));
        grid-template-columns: minmax(280px, .75fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(40px, 8vw, 120px);
      }
      .signal {
        position: relative;
        display: grid;
        min-height: min(54vw, 520px);
        grid-template-columns: 1fr 2px 1fr;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgb(228 225 217 / .18);
        background: rgb(11 16 18 / .88);
      }
      .signal::before, .signal::after {
        content: '';
        position: absolute;
        width: 60%;
        aspect-ratio: 1;
        border: 1px solid rgb(114 217 214 / .28);
        transform: rotate(45deg);
      }
      .signal::after { width: 34%; border-color: rgb(223 101 83 / .5); }
      .signal span { position: relative; z-index: 1; font-size: clamp(82px, 12vw, 170px); font-weight: 300; }
      .signal i { width: 2px; height: 68%; background: linear-gradient(#72d9d6, #df6553); }
      .kicker { margin: 0; color: #72d9d6; font-family: monospace; font-size: 10px; text-transform: uppercase; }
      h1 { max-width: 660px; margin: 18px 0 24px; font-size: clamp(48px, 6vw, 88px); line-height: .94; }
      .copy > p:not(.kicker) { max-width: 530px; margin: 0; color: rgb(228 225 217 / .64); font-size: 16px; line-height: 1.65; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        margin-top: 38px;
        padding: 0 18px;
        background: #e4e1d9;
        color: #070a0b;
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
      }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; padding: 84px 0 40px; }
        .signal { min-height: 250px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="signal" aria-hidden="true"><span>4</span><i></i><span>4</span></div>
      <div class="copy">
        <p class="kicker">Signal lost / 404</p>
        <h1>Drumul acesta nu face parte din sistem.</h1>
        <p>Ruta cerută nu există. Revino în experiența Transylvanian Bears și continuă din harta principală.</p>
        <a href="/">Înapoi în experiență</a>
      </div>
    </main>
  </body>
</html>
